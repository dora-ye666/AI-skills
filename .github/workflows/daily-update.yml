name: AI 早报每日自动更新

on:
  schedule:
    # 每天 UTC 09:00（北京时间 17:00）自动运行
    - cron: '0 9 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行更新脚本
        run: python3 update_ai_daily.py

      - name: 提交并推送数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "没有新数据，跳过提交"
          else
            git commit -m "chore: 自动更新 AI 早报 $(date +'%Y-%m-%d')"
            git push
          fi
